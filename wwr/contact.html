<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Contact White Water Rafting for inquiries, bookings, and support.">
    <meta name="author" content="Emmanuel Benjamin">
    <title>Contact Us | White Water Rafting</title>
    <link rel="stylesheet" href="styles/rafting.css">
</head>
<body>

<header>
    <div class="logo-box">
        <img src="images/logo.png" alt="White Water Rafting company logo">
    </div> 
<nav>
    <a href="index.html">Home</a>
    <a href="about.html">About Us</a>
    <a href="trips.html">Trips</a>
    <a href="contact.html">Contact Us</a>
</nav>

    </header>

   <main>

    <!-- Company Info -->
    <section>
        <h2>Contact Information</h2>

        <p>Address: 123 River Road, Adventure City</p>
        <p>Phone: +234 81-6391-8252</p>
        <p>Email: info@whitewaterrafting.com</p>

        <iframe 
            src="https://www.google.com/maps/embed?pb="
            width="600" 
            height="450">
        </iframe>
    </section>

    <!-- Employees -->
    <section>
        <h2>Our Team</h2>

        <figure>
            <img src="images/employee1.jpg" alt="Guide John">
            <figcaption>John - Senior Guide</figcaption>
        </figure>

        <figure>
            <img src="images/employee2.jpg" alt="Guide Sarah">
            <figcaption>Sarah - Safety Instructor</figcaption>
        </figure>

        <figure>
            <img src="images/employee3.jpg" alt="Guide Mike">
            <figcaption>Mike - River Expert</figcaption>
        </figure>

    </section>

    <!-- Contact Form -->
    <section>
        <h2>Send Us a Message</h2>

        <form>

            <label>Name</label>
            <input type="text" name="name">

            <label>Email</label>
            <input type="email" name="email">

            <p>Purpose of Message:</p>

            <label><input type="radio" name="purpose"> General Inquiry</label>
            <label><input type="radio" name="purpose"> Reservation Question</label>
            <label><input type="radio" name="purpose"> Website Suggestion</label>

            <label>Message</label>
            <textarea name="message"></textarea>

            <label>
                <input type="checkbox" name="subscribe">
                Please subscribe me to the monthly newsletter
            </label>

            <button type="submit">Send Message</button>

        </form>
    </section>

</main>

    <footer>
        <p>©2026 White Water Rafting | Emmanuel Benjamin</p>

<nav class="socialmedia">
    <a href="https://facebook.com" target="_blank">
        <img src="images/facebook.png" alt="">
    </a>

    <a href="https://instagram.com" target="_blank">
        <img src="images/instagram.png" alt="">
    </a>

    <a href="https://twitter.com" target="_blank">
        <img src="images/twitter.png" alt="">
    </a>
</nav>

    </footer>

</body>
</html>
